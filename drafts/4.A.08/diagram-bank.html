<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>4.A.08 diagram manuscript</title></head><body><main><figure class="figure-panel" data-section="amplification"><svg id="diag-1" viewBox="0 0 580 245" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diag-1-title diag-1-desc"><title id="diag-1-title">Catalytic gain and finite substrate pools</title><desc id="diag-1-desc">An activated receptor recruits several effectors; each generates multiple messenger molecules. Removal competes with production.</desc><defs><marker id="diag-1-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="currentColor"/></marker><marker id="diag-1-stop" markerWidth="9" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M3 0 V12" stroke="currentColor" stroke-width="2"/></marker></defs><g stroke="currentColor" stroke-width="1.7" fill="none"><path d="M150 101 L212 45" marker-end="url(#diag-1-arrow)"/><path d="M150 101 L212 120" marker-end="url(#diag-1-arrow)"/><path d="M150 101 L212 195" marker-end="url(#diag-1-arrow)"/><path d="M342 45 L410 101" marker-end="url(#diag-1-arrow)"/><path d="M342 120 L410 101" marker-end="url(#diag-1-arrow)"/><path d="M342 195 L410 101" marker-end="url(#diag-1-arrow)"/><path d="M485 127 L485 175" marker-end="url(#diag-1-arrow)"/></g><rect x="20" y="75" width="130" height="52" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="85" y="106" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="85" dy="0">Active receptor</tspan></text><rect x="212" y="20" width="130" height="50" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="277" y="50" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="277" dy="0">Effector 1</tspan></text><rect x="212" y="95" width="130" height="50" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="277" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="277" dy="0">Effector 2</tspan></text><rect x="212" y="170" width="130" height="50" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="277" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="277" dy="0">Effector 3</tspan></text><rect x="410" y="75" width="150" height="52" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="485" y="106" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="485" dy="0">Messenger pool</tspan></text><rect x="410" y="175" width="150" height="48" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="485" y="204" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="485" dy="0">PDE removal</tspan></text></svg><figcaption>Schematic: catalytic production is not equivalent to the number of distinct molecules remaining after clearance.</figcaption><button class="tool-btn" type="button" data-figure="diag-1" aria-label="Enlarge Catalytic gain and finite substrate pools">⊕ Enlarge diagram</button></figure>
<figure class="figure-panel" data-section="feedback"><svg id="diag-2" viewBox="0 0 580 245" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diag-2-title diag-2-desc"><title id="diag-2-title">Delayed negative feedback</title><desc id="diag-2-desc">An active kinase drives expression of an opposing phosphatase; the phosphatase removes activating phosphates.</desc><defs><marker id="diag-2-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="currentColor"/></marker><marker id="diag-2-stop" markerWidth="9" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M3 0 V12" stroke="currentColor" stroke-width="2"/></marker></defs><g stroke="currentColor" stroke-width="1.7" fill="none"><path d="M150 96 L225 96" marker-end="url(#diag-2-arrow)"/><path d="M355 96 L415 96" marker-end="url(#diag-2-arrow)"/><path d="M290 122 L290 175" marker-end="url(#diag-2-arrow)"/><path d="M225 201 L170 201" /><path d="M170 201 L170 55" /><path d="M170 55 L290 55" /><path d="M290 55 L290 70" marker-end="url(#diag-2-stop)"/></g><rect x="20" y="70" width="130" height="52" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="85" y="101" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="85" dy="0">Input</tspan></text><rect x="225" y="70" width="130" height="52" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="290" y="101" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="290" dy="0">Active kinase</tspan></text><rect x="415" y="70" width="150" height="52" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="490" y="101" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="490" dy="0">Cellular output</tspan></text><rect x="225" y="175" width="130" height="52" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="290" y="206" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="290" dy="0">Phosphatase</tspan></text></svg><figcaption>Arrows indicate promotion; the final T-shaped edge indicates inhibition. Delayed phosphatase induction may shorten a response.</figcaption><button class="tool-btn" type="button" data-figure="diag-2" aria-label="Enlarge Delayed negative feedback">⊕ Enlarge diagram</button></figure>
<figure class="figure-panel" data-section="gprotein"><svg id="diag-3" viewBox="0 0 580 245" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diag-3-title diag-3-desc"><title id="diag-3-title">The nucleotide-state cycle</title><desc id="diag-3-desc">Receptor-driven exchange promotes the GTP-bound state; hydrolysis, accelerated by RGS, resets G alpha.</desc><defs><marker id="diag-3-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="currentColor"/></marker><marker id="diag-3-stop" markerWidth="9" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M3 0 V12" stroke="currentColor" stroke-width="2"/></marker></defs><g stroke="currentColor" stroke-width="1.7" fill="none"><path d="M210 108 L370 108" marker-end="url(#diag-3-arrow)"/><path d="M370 143 L210 143" marker-end="url(#diag-3-arrow)"/><path d="M290 65 L290 108" marker-end="url(#diag-3-arrow)"/><path d="M290 185 L290 143" marker-end="url(#diag-3-arrow)"/></g><rect x="30" y="95" width="180" height="60" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="120" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="120" dy="0">Gα–GDP + βγ</tspan></text><rect x="370" y="95" width="180" height="60" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="460" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="460" dy="0">Gα–GTP; active</tspan></text><rect x="225" y="20" width="130" height="45" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="290" y="47.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="290" dy="0">Active GPCR</tspan></text><rect x="225" y="185" width="130" height="45" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="290" y="212.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="290" dy="0">RGS protein</tspan></text></svg><figcaption>Upper arrow: GDP release and GTP binding. Lower arrow: GTP hydrolysis to GDP + Pi; RGS accelerates this reaction.</figcaption><button class="tool-btn" type="button" data-figure="diag-3" aria-label="Enlarge The nucleotide-state cycle">⊕ Enlarge diagram</button></figure>
<figure class="figure-panel" data-section="desensitization"><svg id="diag-4" viewBox="0 0 580 245" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diag-4-title diag-4-desc"><title id="diag-4-title">Receptor trafficking and alternative fates</title><desc id="diag-4-desc">GRK phosphorylation and arrestin recruitment reduce coupling; internalized receptors can recycle or be degraded.</desc><defs><marker id="diag-4-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="currentColor"/></marker><marker id="diag-4-stop" markerWidth="9" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M3 0 V12" stroke="currentColor" stroke-width="2"/></marker></defs><g stroke="currentColor" stroke-width="1.7" fill="none"><path d="M143 55 L168 55" marker-end="url(#diag-4-arrow)"/><path d="M293 55 L318 55" marker-end="url(#diag-4-arrow)"/><path d="M380 83 L510 130" marker-end="url(#diag-4-arrow)"/><path d="M380 83 L332 165" marker-end="url(#diag-4-arrow)"/><path d="M260 190 L163 190" marker-end="url(#diag-4-arrow)"/><path d="M90 165 L90 83" marker-end="url(#diag-4-arrow)"/></g><rect x="18" y="28" width="125" height="55" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="80.5" y="60.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="80.5" dy="0">Active GPCR</tspan></text><rect x="168" y="28" width="125" height="55" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="230.5" y="60.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="230.5" dy="0">GRK / arrestin</tspan></text><rect x="318" y="28" width="125" height="55" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="380.5" y="60.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="380.5" dy="0">Internalized</tspan></text><rect x="455" y="130" width="110" height="60" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="510" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="510" dy="0">Degradation</tspan></text><rect x="260" y="165" width="145" height="50" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="332.5" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="332.5" dy="0">Recycling</tspan></text><rect x="18" y="165" width="145" height="50" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="90.5" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="90.5" dy="0">Surface receptor</tspan></text></svg><figcaption>Internalization changes location; recycling can restore responsiveness, while degradation can reduce total receptor number.</figcaption><button class="tool-btn" type="button" data-figure="diag-4" aria-label="Enlarge Receptor trafficking and alternative fates">⊕ Enlarge diagram</button></figure>
<figure class="figure-panel" data-section="phosphatases"><svg id="diag-5" viewBox="0 0 580 245" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diag-5-title diag-5-desc"><title id="diag-5-title">Opposing reactions in a phosphorylation cycle</title><desc id="diag-5-desc">Kinase transfers phosphate from ATP to a protein. Phosphatase hydrolyzes the phosphate ester.</desc><defs><marker id="diag-5-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="currentColor"/></marker><marker id="diag-5-stop" markerWidth="9" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M3 0 V12" stroke="currentColor" stroke-width="2"/></marker></defs><g stroke="currentColor" stroke-width="1.7" fill="none"><path d="M204 108 L375 108" marker-end="url(#diag-5-arrow)"/><path d="M375 143 L204 143" marker-end="url(#diag-5-arrow)"/><path d="M290 65 L290 108" marker-end="url(#diag-5-arrow)"/><path d="M290 185 L290 143" marker-end="url(#diag-5-arrow)"/></g><rect x="24" y="95" width="180" height="60" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="114" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="114" dy="0">Unmodified protein</tspan></text><rect x="375" y="95" width="180" height="60" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="465" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="465" dy="0">Phosphoprotein</tspan></text><rect x="221" y="20" width="140" height="45" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="291" y="47.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="291" dy="0">Kinase: ATP → ADP</tspan></text><rect x="221" y="185" width="140" height="45" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="291" y="212.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="291" dy="0">Phosphatase: H₂O</tspan></text></svg><figcaption>The two arrows are chemically distinct reactions. The phosphatase releases Pi; it does not regenerate ATP.</figcaption><button class="tool-btn" type="button" data-figure="diag-5" aria-label="Enlarge Opposing reactions in a phosphorylation cycle">⊕ Enlarge diagram</button></figure>
<figure class="figure-panel" data-section="messengers"><svg id="diag-6" viewBox="0 0 580 245" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diag-6-title diag-6-desc"><title id="diag-6-title">Cyclic nucleotide production and hydrolysis</title><desc id="diag-6-desc">Cyclase forms cyclic AMP from ATP; PDE hydrolyzes it to AMP. cAMP also activates appropriate effectors.</desc><defs><marker id="diag-6-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="currentColor"/></marker><marker id="diag-6-stop" markerWidth="9" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M3 0 V12" stroke="currentColor" stroke-width="2"/></marker></defs><g stroke="currentColor" stroke-width="1.7" fill="none"><path d="M120 116 L210 116" marker-end="url(#diag-6-arrow)"/><path d="M350 116 L445 116" marker-end="url(#diag-6-arrow)"/><path d="M280 142 L280 175" marker-end="url(#diag-6-arrow)"/></g><rect x="20" y="90" width="100" height="52" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="70" y="121" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="70" dy="0">ATP</tspan></text><rect x="210" y="90" width="140" height="52" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="280" y="121" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="280" dy="0">cAMP</tspan></text><rect x="445" y="90" width="120" height="52" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="505" y="121" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="505" dy="0">5′-AMP</tspan></text><rect x="210" y="175" width="140" height="52" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="280" y="206" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="280" dy="0">PKA target</tspan></text></svg><figcaption>Left arrow: adenylyl cyclase. Right arrow: cyclic nucleotide PDE. The lower branch represents cAMP-dependent signaling.</figcaption><button class="tool-btn" type="button" data-figure="diag-6" aria-label="Enlarge Cyclic nucleotide production and hydrolysis">⊕ Enlarge diagram</button></figure>
<figure class="figure-panel" data-section="calcium"><svg id="diag-7" viewBox="0 0 580 245" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diag-7-title diag-7-desc"><title id="diag-7-title">Routes of calcium clearance</title><desc id="diag-7-desc">Calcium enters the cytosol from extracellular space or ER; PMCA exports it, SERCA returns it to ER, and buffers reversibly bind it.</desc><defs><marker id="diag-7-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="currentColor"/></marker><marker id="diag-7-stop" markerWidth="9" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M3 0 V12" stroke="currentColor" stroke-width="2"/></marker></defs><g stroke="currentColor" stroke-width="1.7" fill="none"><path d="M150 78 L250 100" marker-end="url(#diag-7-arrow)"/><path d="M225 100 L120 78" marker-end="url(#diag-7-arrow)"/><path d="M405 78 L330 100" marker-end="url(#diag-7-arrow)"/><path d="M355 100 L475 78" marker-end="url(#diag-7-arrow)"/><path d="M270 158 L270 185" marker-end="url(#diag-7-arrow)"/><path d="M315 185 L315 158" marker-end="url(#diag-7-arrow)"/></g><rect x="25" y="20" width="170" height="58" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="110" y="54" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="110" dy="0">Extracellular Ca²⁺</tspan></text><rect x="212" y="100" width="160" height="58" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="292" y="134" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="292" dy="0">Free cytosolic Ca²⁺</tspan></text><rect x="405" y="20" width="150" height="58" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="480" y="54" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="480" dy="0">ER Ca²⁺ store</tspan></text><rect x="212" y="185" width="160" height="48" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="292" y="214" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="292" dy="0">Bound Ca²⁺</tspan></text></svg><figcaption>Entry and release move calcium into the cytosol. PMCA and SERCA oppose these flows; binding changes free calcium without destroying ions.</figcaption><button class="tool-btn" type="button" data-figure="diag-7" aria-label="Enlarge Routes of calcium clearance">⊕ Enlarge diagram</button></figure>
<figure class="figure-panel" data-section="scaffolds"><svg id="diag-8" viewBox="0 0 580 245" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diag-8-title diag-8-desc"><title id="diag-8-title">A scaffold assembles a kinase relay</title><desc id="diag-8-desc">Three kinases bind a common scaffold, improving productive encounters without changing intrinsic catalytic properties.</desc><defs><marker id="diag-8-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="currentColor"/></marker><marker id="diag-8-stop" markerWidth="9" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M3 0 V12" stroke="currentColor" stroke-width="2"/></marker></defs><g stroke="currentColor" stroke-width="1.7" fill="none"><path d="M170 51 L215 51" marker-end="url(#diag-8-arrow)"/><path d="M365 51 L410 51" marker-end="url(#diag-8-arrow)"/><path d="M95 77 L95 135" marker-end="url(#diag-8-arrow)"/><path d="M290 77 L290 135" marker-end="url(#diag-8-arrow)"/><path d="M485 77 L485 135" marker-end="url(#diag-8-arrow)"/></g><rect x="20" y="25" width="150" height="52" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="95" y="56" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="95" dy="0">Upstream kinase</tspan></text><rect x="215" y="25" width="150" height="52" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="290" y="56" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="290" dy="0">Intermediate kinase</tspan></text><rect x="410" y="25" width="150" height="52" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="485" y="56" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="485" dy="0">Downstream kinase</tspan></text><rect x="70" y="135" width="440" height="58" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="290" y="153" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="290" dy="0">Scaffold with</tspan><tspan x="290" dy="16">separate binding</tspan><tspan x="290" dy="16">sites</tspan></text></svg><figcaption>Horizontal arrows indicate signal transfer. Vertical lines indicate docking to a common platform.</figcaption><button class="tool-btn" type="button" data-figure="diag-8" aria-label="Enlarge A scaffold assembles a kinase relay">⊕ Enlarge diagram</button></figure>
<figure class="figure-panel" data-section="cross-talk-examples"><svg id="diag-9" viewBox="0 0 580 245" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diag-9-title diag-9-desc"><title id="diag-9-title">Conditional pathway cross-talk through calcium</title><desc id="diag-9-desc">Calcium/calmodulin can regulate appropriate adenylyl cyclase isoforms; cyclic AMP-dependent output depends on the enzyme expressed.</desc><defs><marker id="diag-9-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="currentColor"/></marker><marker id="diag-9-stop" markerWidth="9" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M3 0 V12" stroke="currentColor" stroke-width="2"/></marker></defs><g stroke="currentColor" stroke-width="1.7" fill="none"><path d="M175 62 L215 62" marker-end="url(#diag-9-arrow)"/><path d="M365 62 L415 62" marker-end="url(#diag-9-arrow)"/><path d="M487 90 L365 192" marker-end="url(#diag-9-arrow)"/><path d="M365 192 L415 192" marker-end="url(#diag-9-arrow)"/></g><rect x="20" y="35" width="155" height="55" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="97.5" y="67.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="97.5" dy="0">Ca²⁺-raising input</tspan></text><rect x="215" y="35" width="150" height="55" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="290" y="67.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="290" dy="0">Ca²⁺ / calmodulin</tspan></text><rect x="415" y="35" width="145" height="55" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="487.5" y="67.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="487.5" dy="0">AC1 or AC8</tspan></text><rect x="215" y="165" width="150" height="55" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="290" y="197.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="290" dy="0">cAMP</tspan></text><rect x="415" y="165" width="145" height="55" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="487.5" y="197.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="487.5" dy="0">cAMP effector</tspan></text></svg><figcaption>Illustrative stimulatory cross-talk for Ca²⁺/calmodulin-sensitive cyclases. Other cyclase isoforms respond differently.</figcaption><button class="tool-btn" type="button" data-figure="diag-9" aria-label="Enlarge Conditional pathway cross-talk through calcium">⊕ Enlarge diagram</button></figure>
<figure class="figure-panel" data-section="visual-regulation"><svg id="diag-10" viewBox="0 0 580 245" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diag-10-title diag-10-desc"><title id="diag-10-title">Rod photoreceptor reset</title><desc id="diag-10-desc">GRK and arrestin quench rhodopsin; RGS accelerates transducin hydrolysis. Calcium-dependent regulation of guanylyl cyclase helps replenish cGMP.</desc><defs><marker id="diag-10-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="currentColor"/></marker><marker id="diag-10-stop" markerWidth="9" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M3 0 V12" stroke="currentColor" stroke-width="2"/></marker></defs><g stroke="currentColor" stroke-width="1.7" fill="none"><path d="M170 57 L215 57" marker-end="url(#diag-10-arrow)"/><path d="M365 57 L415 57" marker-end="url(#diag-10-arrow)"/><path d="M487 85 L487 165" marker-end="url(#diag-10-arrow)"/><path d="M95 165 L95 85" marker-end="url(#diag-10-stop)"/><path d="M290 165 L290 85" marker-end="url(#diag-10-stop)"/></g><rect x="20" y="30" width="150" height="55" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="95" y="62.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="95" dy="0">Active rhodopsin</tspan></text><rect x="215" y="30" width="150" height="55" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="290" y="62.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="290" dy="0">Transducin–GTP</tspan></text><rect x="415" y="30" width="145" height="55" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="487.5" y="62.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="487.5" dy="0">PDE6 activity</tspan></text><rect x="20" y="165" width="150" height="55" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="95" y="197.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="95" dy="0">GRK / arrestin</tspan></text><rect x="215" y="165" width="150" height="55" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="290" y="197.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="290" dy="0">RGS9 complex</tspan></text><rect x="415" y="165" width="145" height="55" rx="8" fill="var(--panel,#eef6f0)" stroke="var(--accent,#116746)" stroke-width="1.4"/><text x="487.5" y="197.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="currentColor"><tspan x="487.5" dy="0">cGMP decreases</tspan></text></svg><figcaption>The two inhibitory edges act at distinct levels. During recovery, calcium-dependent guanylyl cyclase regulation helps restore cGMP.</figcaption><button class="tool-btn" type="button" data-figure="diag-10" aria-label="Enlarge Rod photoreceptor reset">⊕ Enlarge diagram</button></figure><figure class="figure-panel" data-section="duration"><svg id="diag-11" viewBox="0 0 580 270" role="img" xmlns="http://www.w3.org/2000/svg" aria-labelledby="diag-11-title diag-11-desc"><title id="diag-11-title">Transient and sustained signaling</title><desc id="diag-11-desc">Two hypothetical responses with equal initial peak diverge in their later activity.</desc><g stroke="currentColor" fill="none"><path d="M68 35 V198 H520"/><path d="M68 48 H520 M68 123 H520" opacity=".16" stroke-dasharray="4 4"/></g><g fill="currentColor" font-family="Arial,sans-serif" font-size="12"><text x="55" y="202" text-anchor="end">0</text><text x="55" y="127" text-anchor="end">0.5</text><text x="55" y="52" text-anchor="end">1</text><text x="68" y="216" text-anchor="middle">0</text><text x="156" y="216" text-anchor="middle">2</text><text x="244"
