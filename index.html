<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1c1b">
  <meta name="description" content="Life Science Academy — a new learning experience is coming soon.">
  <title>Life Science Academy | Coming Soon</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 80% 20%, #174f44 0, transparent 42%), linear-gradient(135deg, #081715, #0e2723 65%, #0b1a1a); color: #f3faf6; }
    .shell { min-height: 100vh; display: flex; flex-direction: column; max-width: 1150px; margin: auto; padding: 28px clamp(20px, 5vw, 64px); }
    header { display: flex; align-items: center; gap: 12px; font-weight: 750; letter-spacing: .02em; }
    .mark { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: #0b2922; background: #a3f0c2; font-size: 22px; }
    main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; max-width: 780px; padding: 84px 0; }
    .eyebrow { display: inline-block; padding: 9px 14px; border: 1px solid #367e68; border-radius: 999px; color: #bcf4d3; background: #123c32; font-size: .84rem; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; }
    h1 { font-size: clamp(3rem, 8.2vw, 6.2rem); line-height: 1.06; letter-spacing: -.055em; margin: 24px 0; }
    h1 span { color: #a3f0c2; }
    p { max-width: 570px; color: #bed0c9; font-size: clamp(1.05rem, 2.5vw, 1.35rem); line-height: 1.7; margin: 0; }
    .rule { width: 86px; height: 3px; background: #a3f0c2; border-radius: 2px; margin-top: 35px; }
    footer { padding: 22px 0 4px; border-top: 1px solid #2b4740; color: #9ab6a9; font-size: .88rem; }
    @media (prefers-reduced-motion: no-preference) { main { animation: appear .7s ease-out both; } @keyframes appear { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } } }
  </style>
</head>
<body>
  <div class="shell">
    <header aria-label="Site brand"><div class="mark" aria-hidden="true">✦</div>Life Science Academy</header>
    <main>
      <div class="eyebrow">A new chapter is beginning</div>
      <h1>Explore life.<br><span>Keep learning.</span></h1>
      <p>Welcome to Life Science Academy. We're creating a new space for curiosity, learning, and discovery in the life sciences. More details are coming soon.</p>
      <div class="rule" aria-hidden="true"></div>
    </main>
    <footer>© Life Science Academy. All rights reserved.</footer>
  </div>
</body>
</html>
